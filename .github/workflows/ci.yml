name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          zig_version=0.16.0
          case "$(uname -m)" in
            x86_64)
              zig_arch=x86_64
              zig_sha=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
              ;;
            aarch64|arm64)
              zig_arch=aarch64
              zig_sha=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
              ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          zig_archive="$RUNNER_TEMP/zig.tar.xz"
          zig_dir="$RUNNER_TEMP/zig"
          curl --fail --location --retry 3 --output "$zig_archive" \
            "https://ziglang.org/download/$zig_version/zig-$zig_arch-linux-$zig_version.tar.xz"
          echo "$zig_sha  $zig_archive" | sha256sum --check --strict
          mkdir -p "$zig_dir"
          tar -xJf "$zig_archive" --strip-components=1 --directory "$zig_dir"
          echo "$zig_dir" >> "$GITHUB_PATH"
          "$zig_dir/zig" version

      - name: Check formatting
        run: zig fmt --check .

      - name: Build
        run: zig build

      - name: Run unit tests
        run: zig build test

      - name: Run golden tests
        run: zig build test-golden

      - name: Run config tests
        run: zig build test-config

      - name: Scan tracked sources
        shell: bash
        run: |
          set -euo pipefail
          conflict_pattern='^(<<<<<<<|=======|>>>>>>>)'
          private_key_prefix='-----BEGIN '
          private_key_pattern="${private_key_prefix}.*PRIVATE KEY.*-----"
          if git grep -nE -e "$conflict_pattern" -- .; then
            echo "tracked conflict marker found" >&2
            exit 1
          fi
          if git grep -nE -e "$private_key_pattern" -- .; then
            echo "tracked private-key material found" >&2
            exit 1
          fi

      - name: Build Docker image
        run: docker build -t zimdns:ci .
