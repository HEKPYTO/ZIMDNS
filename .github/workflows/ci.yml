name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache Zig toolchain
        id: zig-toolchain
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Zig 0.17.0
        if: steps.zig-toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          zig_version=0.17.0
          # The checksums are the ones published in
          # https://ziglang.org/download/index.json for this release.
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              zig_target=x86_64-linux
              zig_sha=1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
              ;;
            Linux-aarch64|Linux-arm64)
              zig_target=aarch64-linux
              zig_sha=9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
              ;;
            *)
              echo "unsupported runner: $(uname -s) $(uname -m)" >&2
              exit 1
              ;;
          esac
          zig_archive="$RUNNER_TEMP/zig.tar.xz"
          zig_dir="$RUNNER_TEMP/zig"
          curl --fail --location --retry 3 --output "$zig_archive" \
            "https://ziglang.org/download/$zig_version/zig-$zig_target-$zig_version.tar.xz"
          # openssl ships on the runner, so one check covers the archive.
          zig_sha_actual="$(openssl dgst -sha256 "$zig_archive")"
          zig_sha_actual="${zig_sha_actual##* }"
          if [ "$zig_sha_actual" != "$zig_sha" ]; then
            echo "zig archive checksum mismatch: $zig_sha_actual != $zig_sha" >&2
            exit 1
          fi
          mkdir -p "$zig_dir"
          tar -xJf "$zig_archive" --strip-components=1 --directory "$zig_dir"

      - name: Add Zig to PATH
        run: echo "${{ runner.temp }}/zig" >> "$GITHUB_PATH"

      - name: Cache Zig build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/zig
          key: zig-build-${{ runner.os }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: zig-build-${{ runner.os }}-

      - name: Install OpenSSL 3 headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgnutls28-dev

      - name: Check formatting
        run: zig fmt --check --exclude zig-pkg .

      - name: Build
        run: zig build

      - name: Run unit tests
        run: zig build test

      - name: Run golden tests
        run: zig build test-golden

      - name: Run config tests
        run: zig build test-config

      - name: Run parser fuzz tests
        run: zig build test-fuzz

      - name: Run socket integration tests
        run: zig build test-integration

      - name: Run documented CLI invocation tests
        run: zig build test-cli

      - name: Scan tracked sources
        shell: bash
        run: |
          set -euo pipefail
          conflict_pattern='^(<<<<<<<|=======|>>>>>>>)'
          private_key_pattern='^-----BEGIN .*PRIVATE KEY-----'
          # A real PEM header starts at column 0; indented test fixtures do not match.
          if git grep -nE -e "$conflict_pattern" -- .; then
            echo "tracked conflict marker found" >&2
            exit 1
          fi
          if git grep -nE -e "$private_key_pattern" -- .; then
            echo "tracked private-key material found" >&2
            exit 1
          fi

      - name: Build Docker image
        run: docker build --build-arg VERSION=0.1.0 --build-arg REVISION=${GITHUB_SHA} --build-arg SOURCE=${{ github.server_url }}/${{ github.repository }} -t zimdns:ci .

      - name: Validate compose config
        run: ZIMDNS_CONFIG_DIR=/tmp/zimdns-config ZIMDNS_IMAGE=zimdns:ci docker compose -f docker-compose.yml config

