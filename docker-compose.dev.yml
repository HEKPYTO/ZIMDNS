services:
  zimdns:
    build:
      context: .
    image: zimdns:dev
    user: "10001:10001"
    ports:
      - "${ZIMDNS_DEV_DNS_PORT:-1053}:1053/udp"
      - "${ZIMDNS_DEV_DNS_PORT:-1053}:1053/tcp"
    volumes:
      - ./examples:/etc/zimdns:ro
    read_only: true
    tmpfs:
      - /run/zimdns
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["server", "run", "--config", "/etc/zimdns/config.gdns", "--serve-udp", "--serve-tcp"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/zimdns", "query", "@127.0.0.1", "-p", "1053", "--require-noerror", "--require-answer", "--tcp", "dns.home.arpa.", "A"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
